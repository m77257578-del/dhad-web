<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر لغة الضاد البرمجية المتكامل</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>محرر لغة الضاد البرمجية 💻 ✨</h1>
        <p>بيئة تطوير متكاملة متعددة اللغات تعمل داخلياً 100% وبدون سيرفرات</p>
    </header>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchLanguage('dhad', event)">لغة الضاد العربية 🇸🇦</button>
        <button class="tab-btn" onclick="switchLanguage('python', event)">Python 🐍</button>
        <button class="tab-btn" onclick="switchLanguage('javascript', event)">JavaScript ⚡</button>
        <button class="tab-btn" onclick="switchLanguage('web', event)">واجهات الويب (HTML/CSS) 🌐</button>
    </div>

    <div class="main-container">
        <div class="editor-section">
            <div class="section-title" id="editor-label">✍️ اكتب كود "لغة الضاد" هنا:</div>
            <div class="editor-wrapper">
                <textarea id="code-editor" spellcheck="false"></textarea>
            </div>
        </div>
        <div class="output-section">
            <div class="section-title">📊 شاشة عرض النتائج المباشرة:</div>
            <div id="output-text">النتيجة ستظهر هنا بعد الضغط على تشغيل الكود...</div>
            <iframe id="output-frame"></iframe>
        </div>
    </div>

    <div class="btn-container">
        <button class="run-btn" onclick="processExecution()">تشغيل الشفرة البرمجية 🚀</button>
    </div>

    <script src="engine.js"></script>
</body>
</html>
